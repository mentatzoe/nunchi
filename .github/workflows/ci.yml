name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deterministic V2 tests are offline. Live-provider and real-room evidence are
# separate attributable release checks.
permissions:
  contents: read

jobs:
  test:
    name: unittest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared offline test dependencies
        run: python -m pip install '.[test]'
      - name: Run the full offline suite
        run: python -m unittest --verbose
      - name: Run the dual-validator contract corpus
        run: python -m unittest discover -s tests/v2/contract -p 'test_*.py'
      - name: Verdict-suite CLI loads the corpus (smoke)
        run: python3 -m evals.verdict_suite.runner --list

  discord-transport:
    # Isolated protocol checks with the actual Discord client. No conversation
    # runner or model responses: Python 3.12 checks zlib, 3.14 checks zstd.
    name: Discord transport (py${{ matrix.python-version }}, discord.py 2.7.1)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned Discord client
        run: python -m pip install 'discord.py==2.7.1' 'aiohttp==3.14.3'
      - name: Check the test server's payload shapes
        run: python -m tests.support.fake_discord.shapes --check
      - name: Check transport behavior through discord.py
        run: python -m unittest tests.v2.test_fake_discord_discordpy -v

  mcp-discord:
    # Preserve the shared transport's SDK compatibility checks independently
    # of agent harnesses. The tests use local stand-ins, with no live services.
    name: Discord MCP transport (mcp ${{ matrix.mcp-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp-version: ["1.10.0", "1.28.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the pinned transport dependencies
        shell: bash
        env:
          MCP_VERSION: ${{ matrix.mcp-version }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/mcp-env"
          PY="$RUNNER_TEMP/mcp-env/bin/python"
          if [ "$MCP_VERSION" = "1.10.0" ]; then
            # MCP 1.10.0 imports an internal API removed by pydantic 2.14.
            "$PY" -m pip install "mcp==${MCP_VERSION}" "pydantic<2.14"
          else
            "$PY" -m pip install "mcp==${MCP_VERSION}"
          fi
          "$PY" -m pip freeze
      - name: Check shared transport gaps and recovery on the real SDK
        run: '"$RUNNER_TEMP/mcp-env/bin/python" -m unittest tests.v2.test_mcp_discord_gaps -v'

  package:
    name: clean-install packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build an isolated install and verify the public surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" python -m build --wheel
          WHEEL="$(find dist -maxdepth 1 -name 'nunchi-*.whl' -print -quit)"
          test -n "$WHEEL"
          sha256sum "$WHEEL"
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --no-deps "$WHEEL"
          cd /tmp
          /tmp/venv/bin/python -c "import nunchi; print(nunchi.__file__)"
          /tmp/venv/bin/nunchi probe
          /tmp/venv/bin/nunchi-conformance
          /tmp/venv/bin/nunchi-turn-conformance --integration reference
          /tmp/venv/bin/nunchi-install probe
          /tmp/venv/bin/nunchi-channel --probe
          /tmp/venv/bin/nunchi-discord --probe
          /tmp/venv/bin/nunchi-matrix --probe
          /tmp/venv/bin/nunchi-telegram --probe
          echo "packaging smoke OK"
