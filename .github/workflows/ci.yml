name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deterministic V2 tests are offline. Live-provider and real-room evidence are
# separate attributable release checks.
permissions:
  contents: read

jobs:
  test:
    name: unittest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared offline test dependencies
        run: python -m pip install '.[test]'
      - name: Run the full offline suite
        run: python -m unittest --verbose
      - name: Run the dual-validator contract corpus
        run: python -m unittest discover -s tests/v2/contract -p 'test_*.py'
      - name: Verdict-suite CLI loads the corpus (smoke)
        run: python3 -m evals.verdict_suite.runner --list

  package:
    name: clean-install packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build an isolated install and verify the public surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" python -m build --wheel
          WHEEL="$(find dist -maxdepth 1 -name 'nunchi-*.whl' -print -quit)"
          test -n "$WHEEL"
          sha256sum "$WHEEL"
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --no-deps "$WHEEL"
          cd /tmp
          /tmp/venv/bin/python -c "import nunchi; print(nunchi.__file__)"
          /tmp/venv/bin/nunchi probe
          /tmp/venv/bin/nunchi-conformance
          /tmp/venv/bin/nunchi-install probe
          /tmp/venv/bin/nunchi-channel --probe
          /tmp/venv/bin/nunchi-discord --probe
          /tmp/venv/bin/nunchi-matrix --probe
          /tmp/venv/bin/nunchi-telegram --probe
          /tmp/venv/bin/nunchi-codex-room-runner --probe
          /tmp/venv/bin/nunchi-claude-code-room-runner --probe | /tmp/venv/bin/python -c "import json, sys; assert json.load(sys.stdin)['mod_version'], 'the Claude Code mod is missing from the wheel'"
          /tmp/venv/bin/nunchi-hermes-dashboard --help
          echo "packaging smoke OK"

  claude-code-mod:
    name: Claude Code mod
    runs-on: ubuntu-latest
    env:
      # The mod needs the mods API; keep this at or above MINIMUM_CLAUDE_CODE.
      CLAUDE_CODE_VERSION: "2.1.289"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate the mod against the pinned Claude Code
        run: npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate --strict src/nunchi/integrations/claude_code_mod
      - name: Run the mod's tests against the pinned Claude Code
        run: npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin test src/nunchi/integrations/claude_code_mod
