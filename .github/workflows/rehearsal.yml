name: rehearsal

# MANUAL ONLY. The step 9f probe (docs/rehearsal.md): each real harness, on a
# clean, pinned install, with a live model through OpenRouter, takes part in
# two moments of a room through Nunchi. It costs money (estimated under $1 for
# all three harnesses), so it never runs on push or pull_request. A job passes
# only when the harness reached its model and took part in the room through
# Nunchi, with attention judging (docs/rehearsal.md, What a pass means);
# whether a moment got a post is reported, not judged.
#
# With room discord (PR 4d) the dispatch plays the behavior suite's directed
# scenes live instead (docs/rehearsal.md, Directed scenes): the scenes input
# lists them (the four of PR 4a by default), and each is played `passes` times
# on the reference (nunchi-discord on the same models, the control), Claude
# Code and Codex, on the Discord stand-in at Discord's real names, inside the
# launcher WITHOUT --offline (it needs OpenRouter; the launcher allows that on
# a CI runner only). The scenes' expectations are drafts Zoe has not reviewed,
# so every grade is reported in the job summary (a matrix titled as draft
# expectations) and none is a failure; the plumbing and safety checks fail the
# run as always. It costs money (estimated about $1.40 a pass for the three
# columns, unmeasured), so it too never runs on push or pull_request.
#
# THE LIVE RUN'S EGRESS IS OPEN (room discord, and the in-process live probe
# before it). The launcher runs online because the models are on the internet,
# so the harnesses, their tools and the reference can reach any host. What
# bounds it: Codex's workspace-write sandbox has network_access = false, Claude
# Code's Bash tool runs in its sandbox (bubblewrap, the launcher checks it),
# the Discord names lead to the stand-in at 127.0.0.1 and ::1 (and the stand-in
# answers with a certificate for them only), the harnesses are asked to keep
# off telemetry (CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC, DISABLE_TELEMETRY),
# and no real Discord credential is on the runner. A network-sealed live run (a
# private network namespace with a relay to openrouter.ai) is planned, not built.
#
# The key comes from the NUNCHI_OPENROUTER repository secret, and only the
# probe and scan steps see it. The scan is its own step and runs whatever
# happened before it, a probe step's timeout or a cancel included: it reads
# every output for the key and for a planted canary, and a hit deletes the
# outputs and fails the job. The summary and the upload run only after a
# clean scan, so an unscanned output is never uploaded. In the scenes job a step
# before the scan TERMs and then KILLs whatever the play step left running (a
# timeout or a cancel can leave root's launcher, the Discord processes and the
# harnesses writing into the outputs the scan reads) and fails if anything
# remains; the scan, the summary and the upload run only when nothing was left.
# The spend watchdog reads the key's usage between moments and stops a probe run
# at budget_usd, and after the last moment reads the lagging usage figure for
# about 75 s, keeping each read and the last figure as the settled one. It is a
# record and a soft limit between moments, never a limit inside one
# (docs/rehearsal.md, Cost).
#
# The Codex job also runs the labelled OpenAI-model arm (design choice 5,
# docs/rehearsal.md, R3) after its main run, whether that passed or failed:
# the same probe with codex_openai_model as the agent's model, recorded under
# rehearsal-out/openai-arm/ and reported on its own, so that a refusal of
# Codex's namespace tools on a Claude model can be told apart from a failure
# of the route. An empty codex_openai_model skips it.
on:
  workflow_dispatch:
    inputs:
      harness:
        description: Which harness to probe
        required: true
        default: all
        type: choice
        options:
          - all
          - claude-code
          - codex
          - hermes
      agent_model:
        description: The agent's model, an OpenRouter id (for Claude Code, a Claude slug in evals/rehearsal/routes.py CLAUDE_CODE_MODELS)
        required: true
        default: anthropic/claude-haiku-4.5
      attention_model:
        description: The attention model, an OpenRouter id, optionally @effort
        required: true
        default: openai/gpt-6-luna@low
      budget_usd:
        description: A plain positive number. Stop before the next moment once the key has spent this much in a probe run (soft limit). With room discord, the budget is for the whole dispatch, all passes together, and the runs not started are listed as skipped
        required: true
        default: "2"
      codex_openai_model:
        description: The Codex job's labelled OpenAI-model arm (R3), run after its main run, an OpenRouter openai/ id; empty skips it. In-process room only
        required: false
        default: openai/gpt-6-luna
      room:
        description: "in-process: the two-moment probe in the harness (the default). discord: the directed scenes, played live on the Discord stand-in by the reference, the chosen harness(es) and the reference as control (Hermes plays none)"
        required: true
        default: in-process
        type: choice
        options:
          - in-process
          - discord
      scenes:
        description: Room discord only. Behavior scene ids, separated by spaces (evals/behavior/scenes/behavior); the default is the four scenes of PR 4a
        required: false
        default: bot-status-report story-across-messages said-it-would-check mention-in-busy-room
      passes:
        description: Room discord only. How many times each scene is played on each column (23% of woken moments change move between runs); the cost grows with it
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: read

# One rehearsal at a time, so each job's spend reading is its own.
concurrency:
  group: rehearsal
  cancel-in-progress: false

jobs:
  probe:
    name: probe (${{ matrix.harness }})
    # The in-process room, as always. Room discord runs the `scenes` job below instead.
    if: ${{ inputs.room != 'discord' }}
    runs-on: ubuntu-latest
    # Two probe runs of up to 30 minutes each in the Codex job.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        harness: ${{ fromJSON(inputs.harness == 'all' && '["claude-code","codex","hermes"]' || format('["{0}"]', inputs.harness)) }}
    env:
      CLAUDE_CODE_VERSION: "2.1.289"
      CODEX_VERSION: "0.160.1"
    steps:
      # Pinned as in the other workflows: v7.0.1 (the v7 tag), v6.3.0 (the v6 tag),
      # and upload-artifact v7.0.1 (the v7 tag has since moved to v7.0.2, cf430e03).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The agent has a shell: leave it no GitHub token in .git/config.
          persist-credentials: false
      - name: Check out Hermes
        if: matrix.harness == 'hermes'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: a50406d9b7474b060450d2dcaff8743c977d296a
          path: hermes-agent
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Current Hermes gates its core dependencies on Python 3.14.
          python-version: ${{ matrix.harness == 'hermes' && '3.14' || '3.12' }}
      - name: Build Nunchi's wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/nunchi-wheels"
          sha256sum "$RUNNER_TEMP"/nunchi-wheels/*.whl
          echo "NUNCHI_WHEEL=$(ls "$RUNNER_TEMP"/nunchi-wheels/*.whl)" >> "$GITHUB_ENV"
      - name: Install the pinned Codex in a clean location
        if: matrix.harness == 'codex'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/env"
          "$RUNNER_TEMP/env/bin/python" -m pip install --no-deps "$NUNCHI_WHEEL"
          mkdir -p "$RUNNER_TEMP/codex"
          npm install --prefix "$RUNNER_TEMP/codex" --no-audit --no-fund "@openai/codex@${CODEX_VERSION}"
          echo "NUNCHI_CODEX_BIN=$RUNNER_TEMP/codex/node_modules/.bin/codex" >> "$GITHUB_ENV"
      - name: Install the pinned Claude Code in a clean location
        if: matrix.harness == 'claude-code'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/env"
          "$RUNNER_TEMP/env/bin/python" -m pip install --no-deps "$NUNCHI_WHEEL"
          mkdir -p "$RUNNER_TEMP/claude"
          npm install --prefix "$RUNNER_TEMP/claude" --no-audit --no-fund "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          echo "NUNCHI_CLAUDE_BIN=$RUNNER_TEMP/claude/node_modules/.bin/claude" >> "$GITHUB_ENV"
      - name: Install bubblewrap for the harness's sandbox
        # Each README's user settings sandbox the agent's commands with
        # bubblewrap: Claude Code's Bash sandbox (which also needs socat), and
        # Codex's workspace-write sandbox, which on Linux needs a bwrap that can
        # create user namespaces (codex-rs/linux-sandbox/README.md at 0.160.1;
        # without one on PATH Codex falls back to its bundled copy and warns).
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
        if: matrix.harness == 'claude-code' || matrix.harness == 'codex'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / true || { echo "::error::bubblewrap cannot run here, so the ${{ matrix.harness }} sandbox in its README's user settings cannot start"; exit 1; }
      - name: Install untouched Hermes and Nunchi's wheel in a clean virtualenv
        if: matrix.harness == 'hermes'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/env"
          "$RUNNER_TEMP/env/bin/python" -m pip install --upgrade pip
          git clone --no-local --no-checkout hermes-agent "$RUNNER_TEMP/stock-hermes"
          git -C "$RUNNER_TEMP/stock-hermes" checkout --detach "$(git -C hermes-agent rev-parse HEAD)"
          "$RUNNER_TEMP/env/bin/python" -m pip install -e "$RUNNER_TEMP/stock-hermes[messaging]"
          "$RUNNER_TEMP/env/bin/python" -m pip install --no-deps "$NUNCHI_WHEEL"
      - name: Make the canary
        # A random value in the harness's environment that no *_env key names,
        # so only the scan can catch it in an output. Made here, masked, and
        # handed to the probe and the scan steps through the job's environment.
        shell: bash
        run: |
          set -euo pipefail
          canary="canary-$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$canary"
          echo "REHEARSAL_CANARY=$canary" >> "$GITHUB_ENV"
      - name: Probe
        # The probe runs the harness as a clean user and records variable
        # names, never values. It scans its own outputs when it ends; the scan
        # step scans them again, whether or not this step ended.
        timeout-minutes: 30
        env:
          NUNCHI_ATTENTION_API_KEY: ${{ secrets.NUNCHI_OPENROUTER }}
          ANTHROPIC_AUTH_TOKEN: ${{ matrix.harness == 'claude-code' && secrets.NUNCHI_OPENROUTER || '' }}
          OPENROUTER_API_KEY: ${{ matrix.harness != 'claude-code' && secrets.NUNCHI_OPENROUTER || '' }}
          HARNESS: ${{ matrix.harness }}
          AGENT_MODEL: ${{ inputs.agent_model }}
          ATTENTION_MODEL: ${{ inputs.attention_model }}
          BUDGET_USD: ${{ inputs.budget_usd }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${NUNCHI_ATTENTION_API_KEY:-}" ]; then
            echo "::error::The NUNCHI_OPENROUTER secret is not set."
            exit 1
          fi
          "$RUNNER_TEMP/env/bin/python" -m evals.rehearsal.probe \
            --harness "$HARNESS" \
            --out rehearsal-out \
            --budget-usd "$BUDGET_USD" \
            --agent-model "$AGENT_MODEL" \
            --attention-model "$ATTENTION_MODEL" \
            --wheel "$NUNCHI_WHEEL"
      - name: Probe Codex on an OpenAI model (the labelled R3 arm)
        # After the main run, whether it passed or failed: the same route and
        # attention, an OpenAI model as the agent's. Its record and summary
        # are its own (rehearsal-out/openai-arm/codex/), and so is its exit.
        if: ${{ !cancelled() && matrix.harness == 'codex' && inputs.codex_openai_model != '' }}
        timeout-minutes: 30
        env:
          NUNCHI_ATTENTION_API_KEY: ${{ secrets.NUNCHI_OPENROUTER }}
          OPENROUTER_API_KEY: ${{ secrets.NUNCHI_OPENROUTER }}
          AGENT_MODEL: ${{ inputs.codex_openai_model }}
          ATTENTION_MODEL: ${{ inputs.attention_model }}
          BUDGET_USD: ${{ inputs.budget_usd }}
        shell: bash
        run: |
          set -uo pipefail
          "$RUNNER_TEMP/env/bin/python" -m evals.rehearsal.probe \
            --harness codex \
            --arm "OpenAI-model arm for R3" \
            --out rehearsal-out/openai-arm \
            --budget-usd "$BUDGET_USD" \
            --agent-model "$AGENT_MODEL" \
            --attention-model "$ATTENTION_MODEL" \
            --wheel "$NUNCHI_WHEEL"
      - name: Scan every output for the key and the canary
        # Runs after a failure, a timeout or a cancel of the probe step too.
        # One secret goes in under every key variable, so its value and the
        # canary's are all there is to look for. A hit deletes the outputs and
        # fails this step; the leak notice (files and variables, never a
        # value) goes to the job summary, and nothing is uploaded.
        id: scan
        if: always()
        timeout-minutes: 5
        env:
          NUNCHI_ATTENTION_API_KEY: ${{ secrets.NUNCHI_OPENROUTER }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          "$RUNNER_TEMP/env/bin/python" -m evals.rehearsal.scan --out rehearsal-out \
            --env NUNCHI_ATTENTION_API_KEY --env REHEARSAL_CANARY || status=$?
          if [ "$status" -ne 0 ] && [ -f rehearsal-out/summary.md ]; then
            cat rehearsal-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Summary
        if: always() && steps.scan.outcome == 'success'
        env:
          HARNESS: ${{ matrix.harness }}
          ARM_MODEL: ${{ inputs.codex_openai_model }}
        shell: bash
        run: |
          show() {
            if [ -f "$1" ]; then cat "$1" >> "$GITHUB_STEP_SUMMARY"; else echo "$2" >> "$GITHUB_STEP_SUMMARY"; fi
          }
          show "rehearsal-out/$HARNESS/summary.md" "The probe wrote no summary: it did not end (see the probe step's log)."
          if [ "$HARNESS" = codex ] && [ -n "$ARM_MODEL" ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            show rehearsal-out/openai-arm/codex/summary.md \
              "The OpenAI-model arm wrote no summary: it did not run or did not end (see its step's log)."
          fi
      - name: Upload the record
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-${{ matrix.harness }}-${{ github.run_id }}
          path: rehearsal-out/
          if-no-files-found: ignore

  scenes:
    # Room discord (PR 4d): the directed scenes, live. One job for every column, so that the job summary can set the reference
    # (the control) beside Claude Code and Codex in one matrix. Hermes plays no scene (parked); asking for it stops the job.
    name: scenes (${{ inputs.harness }}, ${{ inputs.passes }} pass(es))
    if: ${{ inputs.room == 'discord' }}
    runs-on: ubuntu-latest
    # The installs (up to about 15 minutes), the play step (300), stopping what it left (5), the scan (5), the summary (5) and the
    # upload (10), with margin: GitHub ends a job at its limit, and the scan and the upload must not be what runs out of time.
    timeout-minutes: 350
    env:
      CLAUDE_CODE_VERSION: "2.1.289"
      CODEX_VERSION: "0.160.1"
      # The pins the Discord lanes of ci.yml run on: the mcp-discord extra for nunchi-mcp-discord, and discord.py for the reference.
      MCP_VERSION: "1.28.1"
      DISCORD_PY_VERSION: "2.7.1"
      AIOHTTP_VERSION: "3.14.3"
      # One scene run, launcher included. A longer one is stopped (SIGTERM, then SIGKILL after KILL_AFTER_SECONDS) and reads as a
      # failure of that run. The play step plans its runs inside PLAY_LIMIT_MINUTES (a run is given what is left, wind-up included, and
      # none is started with less than ten minutes left), so the step's own timeout below is a backstop that should never be the one.
      RUN_TIMEOUT_MINUTES: "40"
      KILL_AFTER_SECONDS: "300"
      PLAY_LIMIT_MINUTES: "290"
    steps:
      # Pinned as in the other jobs: v7.0.1 (the v7 tag), v6.3.0 (the v6 tag), and upload-artifact v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The agent has a shell: leave it no GitHub token in .git/config.
          persist-credentials: false
      - name: Check the inputs
        # Values only reach the shell through the environment, never by interpolation into the script. No secret is in this step's
        # environment, and it runs before anything is installed: it reads the scene ids from the repository (stdlib only).
        id: inputs
        env:
          HARNESS: ${{ inputs.harness }}
          SCENES: ${{ inputs.scenes }}
          PASSES: ${{ inputs.passes }}
          BUDGET_USD: ${{ inputs.budget_usd }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          if [ "$HARNESS" = hermes ]; then
            fail "Hermes plays no scene (the plugin is parked, AGENTS.md); choose all, claude-code or codex."
          fi
          case "$PASSES" in 1|2|3) ;; *) fail "passes is 1, 2 or 3." ;; esac
          # A plain positive number: nan, inf, signs and exponents are not one (awk and float() read them as numbers).
          [[ "$BUDGET_USD" =~ ^[0-9]+(\.[0-9]+)?$ ]] || fail "budget_usd must be a plain positive number, such as 2 or 2.5."
          awk -v budget="$BUDGET_USD" 'BEGIN { exit !(budget > 0) }' || fail "budget_usd must be above zero."
          # The whole string, anchored: scene ids (lowercase words joined by hyphens) separated by single spaces, nothing else.
          [[ "$SCENES" =~ ^[a-z0-9]+(-[a-z0-9]+)*( [a-z0-9]+(-[a-z0-9]+)*)*$ ]] || fail "scenes must be behavior scene ids separated by single spaces."
          playable="$(PYTHONPATH=src python3 -c 'from evals.rehearsal import directed; print(" ".join(sorted(p.scene.id for p in directed.load_plans() if not p.unplayable)))')"
          [ -n "$playable" ] || fail "no behavior scene can be played."
          set -f  # the loop below is unquoted on purpose; no token of it is a pattern to expand
          clean=()
          for scene in $SCENES; do
            case " $playable " in
              *" $scene "*) ;;
              *) fail "no playable scene is called $scene. Playable: $playable" ;;
            esac
            case " ${clean[*]:-} " in *" $scene "*) continue ;; esac
            clean+=("$scene")
          done
          set +f
          read -r -a every <<< "$playable"
          [ "${#clean[@]}" -le "${#every[@]}" ] || fail "more scenes than there are playable ones."
          # Only the checked, de-duplicated ids go on to the later steps.
          echo "SCENES_CLEAN=${clean[*]}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Build Nunchi's wheel and the two virtualenvs
        # As ci.yml's Discord lanes: the reference runs on discord.py, Claude Code and Codex through nunchi-mcp-discord on mcp.
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/nunchi-wheels"
          sha256sum "$RUNNER_TEMP"/nunchi-wheels/*.whl
          python -m venv "$RUNNER_TEMP/reference-env"
          "$RUNNER_TEMP/reference-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/reference-env/bin/python" -m pip install "discord.py==${DISCORD_PY_VERSION}" "aiohttp==${AIOHTTP_VERSION}"
          "$RUNNER_TEMP/reference-env/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/nunchi-wheels/*.whl
          "$RUNNER_TEMP/reference-env/bin/python" -m pip freeze
          python -m venv "$RUNNER_TEMP/transport-env"
          "$RUNNER_TEMP/transport-env/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/nunchi-wheels/*.whl
          "$RUNNER_TEMP/transport-env/bin/python" -m pip install "mcp==${MCP_VERSION}"
          "$RUNNER_TEMP/transport-env/bin/python" -m pip freeze
      - name: Install the pinned Codex in a clean location
        if: inputs.harness == 'all' || inputs.harness == 'codex'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex"
          npm install --prefix "$RUNNER_TEMP/codex" --no-audit --no-fund "@openai/codex@${CODEX_VERSION}"
          echo "NUNCHI_CODEX_BIN=$RUNNER_TEMP/codex/node_modules/.bin/codex" >> "$GITHUB_ENV"
      - name: Install the pinned Claude Code in a clean location
        if: inputs.harness == 'all' || inputs.harness == 'claude-code'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/claude"
          npm install --prefix "$RUNNER_TEMP/claude" --no-audit --no-fund "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          echo "NUNCHI_CLAUDE_BIN=$RUNNER_TEMP/claude/node_modules/.bin/claude" >> "$GITHUB_ENV"
      - name: Install bubblewrap for the harnesses' sandboxes
        # As in the probe job: Claude Code's Bash sandbox (with socat) and Codex's workspace-write sandbox, which the launcher
        # checks (--require-bwrap) before any harness starts. Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
        if: inputs.harness == 'all' || inputs.harness == 'claude-code' || inputs.harness == 'codex'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / true || { echo "::error::bubblewrap cannot run here, so the harnesses' sandboxes cannot start"; exit 1; }
      - name: Make the canary
        # As in the probe job: a random value in each harness's environment that no *_env key names, so only the scan can catch it.
        shell: bash
        run: |
          set -euo pipefail
          canary="canary-$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$canary"
          echo "REHEARSAL_CANARY=$canary" >> "$GITHUB_ENV"
      - name: Play the scenes live
        # Each scene is one probe run per column and pass, inside the launcher, WITHOUT --offline: this is the only place the
        # launcher runs online (it refuses unless CI=true and GITHUB_ACTIONS=true, and the probe refuses a live scene off a CI runner
        # and without the keys its column needs). Every launcher run has a timeout of its own (RUN_TIMEOUT_MINUTES, or what is left of
        # PLAY_LIMIT_MINUTES), and the step has one too. A run that fails does not stop the others; the step fails after the last.
        # The keys stay in the environment, never on a command line, and each column keeps only the two it reads (`env -u` drops
        # the others). Grades are reported in the summary and never fail a run; a hard check does.
        #
        # The timeout: GNU `timeout`, run without --foreground, puts itself and its command in a process group of its own and, when
        # time is up, sends TERM to that whole group, not only to the launcher: the launcher, the probe and the harness's processes.
        # The launcher passes its TERM on to the probe, which turns the first one into an interrupt and winds the run up (stops the
        # Discord processes, reads the key's usage one last time for up to 75 s, writes the record); a second is ignored, so the
        # duplicate is harmless. The Discord processes run in sessions of their own (setsid), so the group's TERM does not reach
        # them: the probe's wind-up stops them, and the next step catches any that outlive it. --kill-after is how long the wind-up
        # has before SIGKILL, KILL_AFTER_SECONDS, enough for that last usage read and the record.
        #
        # The budget is for the whole dispatch: once the runs so far have recorded budget_usd (the recorded figure lags the
        # calls), no further run is started, and each run not started is written to status.tsv as skipped, with why in halted.tsv.
        id: play
        timeout-minutes: 300
        env:
          NUNCHI_ATTENTION_API_KEY: ${{ secrets.NUNCHI_OPENROUTER }}
          NUNCHI_PARTICIPANT_API_KEY: ${{ secrets.NUNCHI_OPENROUTER }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.NUNCHI_OPENROUTER }}
          OPENROUTER_API_KEY: ${{ secrets.NUNCHI_OPENROUTER }}
          HARNESS: ${{ inputs.harness }}
          PASSES: ${{ inputs.passes }}
          AGENT_MODEL: ${{ inputs.agent_model }}
          ATTENTION_MODEL: ${{ inputs.attention_model }}
          BUDGET_USD: ${{ inputs.budget_usd }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${NUNCHI_ATTENTION_API_KEY:-}" ]; then
            echo "::error::The NUNCHI_OPENROUTER secret is not set."
            exit 1
          fi
          REF_PY="$RUNNER_TEMP/reference-env/bin/python"
          TR_PY="$RUNNER_TEMP/transport-env/bin/python"
          WHEEL="$(ls "$RUNNER_TEMP"/nunchi-wheels/*.whl)"
          OUT="$PWD/rehearsal-out"
          mkdir -p "$OUT/logs"
          : > "$OUT/status.tsv"
          case "$HARNESS" in
            all) columns="reference claude-code codex" ;;
            claude-code) columns="reference claude-code" ;;
            codex) columns="reference codex" ;;
          esac
          # Without a key in its environment: it reads the records, never the provider.
          spent_so_far() {
            env -u NUNCHI_ATTENTION_API_KEY -u NUNCHI_PARTICIPANT_API_KEY -u ANTHROPIC_AUTH_TOKEN -u OPENROUTER_API_KEY \
              "$TR_PY" -m evals.rehearsal.matrix --in "$OUT" --spent
          }
          failed=0
          halted=""
          spent=0
          last_run="none"
          started_at=$SECONDS
          set -f  # SCENES_CLEAN holds checked scene ids; the loop is unquoted on purpose and expands no pattern
          for pass in $(seq 1 "$PASSES"); do
            for scene in $SCENES_CLEAN; do
              for column in $columns; do
                if [ -z "$halted" ]; then
                  left=$(( PLAY_LIMIT_MINUTES * 60 - (SECONDS - started_at) - KILL_AFTER_SECONDS ))
                  if [ "$left" -lt 600 ]; then
                    halted="time"
                    printf '%s\t%s\t%s\t%s\n' time "$spent" "$BUDGET_USD" "$last_run" >> "$OUT/halted.tsv"
                    echo "::warning::less than ten minutes of the play step's ${PLAY_LIMIT_MINUTES} are left; no further scene run is started."
                  fi
                fi
                if [ -n "$halted" ]; then
                  printf '%s\t%s\t%s\t%s\n' "$pass" "$scene" "$column" skipped >> "$OUT/status.tsv"
                  continue
                fi
                limit=$(( RUN_TIMEOUT_MINUTES * 60 ))
                [ "$left" -ge "$limit" ] || limit="$left"
                case "$column" in
                  reference)
                    PY="$REF_PY"; extra=(--discord-python "$REF_PY"); bwrap=(); drop=(-u ANTHROPIC_AUTH_TOKEN -u OPENROUTER_API_KEY) ;;
                  claude-code)
                    PY="$TR_PY"; extra=(); bwrap=(--require-bwrap); drop=(-u NUNCHI_PARTICIPANT_API_KEY -u OPENROUTER_API_KEY) ;;
                  codex)
                    PY="$TR_PY"; extra=(); bwrap=(--require-bwrap); drop=(-u NUNCHI_PARTICIPANT_API_KEY -u ANTHROPIC_AUTH_TOKEN) ;;
                esac
                LANE_HOME="$(mktemp -d)"
                LANE_TMP="$(mktemp -d)"
                errlog="$OUT/logs/pass-$pass-$scene-$column.stderr"
                sudo -E timeout --signal=TERM --kill-after="${KILL_AFTER_SECONDS}s" "${limit}s" \
                  env "${drop[@]}" HOME="$LANE_HOME" TMPDIR="$LANE_TMP" \
                  "$PY" -m evals.rehearsal.discord_net "${bwrap[@]}" -- \
                  /usr/bin/env PATH="$PATH" "$PY" -m evals.rehearsal.probe --harness "$column" --room discord --scene "$scene" \
                  "${extra[@]}" --agent-model "$AGENT_MODEL" --attention-model "$ATTENTION_MODEL" --budget-usd "$BUDGET_USD" \
                  --wheel "$WHEEL" --out "$OUT/pass-$pass/$scene" 2> "$errlog"
                code=$?
                # What the launcher or the probe said on stderr is the cause of a failure that left no record: keep its tail (it
                # is scanned with everything else, and the summary's table of runs shows it), and show all of it in this log.
                if [ -s "$errlog" ]; then
                  cat "$errlog" >&2
                  tail -n 40 "$errlog" > "$errlog.tail" && mv "$errlog.tail" "$errlog"
                fi
                printf '%s\t%s\t%s\t%s\n' "$pass" "$scene" "$column" "$code" >> "$OUT/status.tsv"
                last_run="$pass $scene $column"
                if [ "$code" -ne 0 ]; then
                  echo "::error::pass $pass, $scene on $column: exit $code"
                  failed=1
                fi
                # A soft limit over the whole dispatch: the recorded spend lags the calls, so this reads a figure that is late. A
                # figure that cannot be read stops the runs rather than counting as nothing spent.
                if spent="$(spent_so_far)" && [[ "$spent" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
                  if awk -v spent="$spent" -v budget="$BUDGET_USD" 'BEGIN { exit !(spent >= budget) }'; then
                    halted="budget"
                    echo "::warning::the dispatch has recorded \$$spent of its \$$BUDGET_USD budget; no further scene run is started."
                  fi
                else
                  halted="spend-unreadable"
                  spent="?"
                  echo "::warning::the recorded spend could not be read; no further scene run is started."
                fi
                if [ -n "$halted" ]; then
                  printf '%s\t%s\t%s\t%s\n' "$halted" "$spent" "$BUDGET_USD" "$last_run" >> "$OUT/halted.tsv"
                fi
              done
            done
          done
          set +f
          exit "$failed"
      - name: Stop whatever the scenes left running
        # After a failure, a timeout or a cancel of the step above too. A timed-out or cancelled step can leave root's sudo, timeout
        # and launcher, the Discord processes (each in a session of its own) and the harnesses writing into rehearsal-out while the
        # scan reads it, so that a file could be uploaded unscanned. This TERMs and then KILLs everything of the scenes, waits, and
        # fails if anything remains: the scan, the summary and the upload run only when nothing was left.
        id: stop
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          set -uo pipefail
          # Extended regular expressions against the whole command line; each is written so that its own text does not match it.
          patterns=('evals\.rehearsal' 'nunchi-(mcp-)?discord' "$RUNNER_TEMP/(claude|codex)/" '(^|/)(bwrap|socat)( |$)')
          alive() {
            local pattern
            for pattern in "${patterns[@]}"; do
              if sudo pgrep -f -- "$pattern" > /dev/null; then return 0; fi
            done
            return 1
          }
          for signal in TERM KILL; do
            alive || break
            for pattern in "${patterns[@]}"; do
              sudo pkill "-$signal" -f -- "$pattern" || true
            done
            for _ in $(seq 1 30); do
              alive || break
              sleep 1
            done
          done
          if alive; then
            echo "::error::processes of the scenes are still running after TERM and KILL; the records are neither scanned nor uploaded."
            for pattern in "${patterns[@]}"; do sudo pgrep -af -- "$pattern" || true; done
            {
              echo "## Not scanned, not uploaded"
              echo
              echo "Processes of the scenes were still running after TERM and KILL, so they could still have been writing into the records."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Scan every output for the key and the canary
        # Runs after a failure, a timeout or a cancel of the play step too, once nothing of the scenes is left running. One secret goes
        # in under every key variable, so its value and the canary's are all there is to look for. A hit deletes the outputs and fails
        # this step; the leak notice (files and variables, never a value) goes to the job summary, and nothing is uploaded or
        # summarized from them.
        id: scan
        if: always() && steps.stop.outcome == 'success'
        timeout-minutes: 5
        env:
          NUNCHI_ATTENTION_API_KEY: ${{ secrets.NUNCHI_OPENROUTER }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          "$RUNNER_TEMP/transport-env/bin/python" -m evals.rehearsal.scan --out rehearsal-out \
            --env NUNCHI_ATTENTION_API_KEY --env REHEARSAL_CANARY || status=$?
          if [ "$status" -ne 0 ] && [ -f rehearsal-out/summary.md ]; then
            cat rehearsal-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Summary
        # Only after a clean scan: the grade matrix per pass and column, titled as draft expectations, then each run's exit status and the cost.
        if: always() && steps.stop.outcome == 'success' && steps.scan.outcome == 'success'
        timeout-minutes: 5
        env:
          HARNESS: ${{ inputs.harness }}
        shell: bash
        run: |
          set -uo pipefail
          case "$HARNESS" in
            all) columns="reference,claude-code,codex" ;;
            claude-code) columns="reference,claude-code" ;;
            codex) columns="reference,codex" ;;
          esac
          if [ -d rehearsal-out ]; then
            "$RUNNER_TEMP/transport-env/bin/python" -m evals.rehearsal.matrix --in rehearsal-out --columns "$columns" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The scenes wrote no record: the job stopped before the first run (see the step's log)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the records
        if: always() && steps.stop.outcome == 'success' && steps.scan.outcome == 'success'
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-scenes-${{ github.run_id }}
          path: rehearsal-out/
          if-no-files-found: ignore
