[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nunchi"
version = "2.0.0"
description = "Participant-shaped pre-attention for secure shared conversations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [
  { name = "Nunchi contributors" }
]
dependencies = []
keywords = [
  "nunchi",
  "agents",
  "llm",
  "pre-attention",
  "turn-taking",
  "read-the-room",
  "moderation",
  "openrouter",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
discord = ["discord.py>=2.4"]
mcp-discord = ["mcp>=1.9,<2"]
test = ["jsonschema==4.26.0"]

[project.urls]
Homepage = "https://github.com/mentatzoe/nunchi"
Repository = "https://github.com/mentatzoe/nunchi"
Issues = "https://github.com/mentatzoe/nunchi/issues"

[project.scripts]
nunchi = "nunchi.cli:main"
nunchi-conformance = "nunchi.conformance:main"
nunchi-install = "nunchi.install:main"
nunchi-channel = "nunchi.adapters.channel:main"
nunchi-matrix = "nunchi.adapters.matrix:main"
nunchi-telegram = "nunchi.adapters.telegram:main"
nunchi-discord = "nunchi.adapters.discord:main"
nunchi-mcp-discord = "nunchi.mcp_discord.server:main"
nunchi-codex-room-runner = "nunchi.integrations.codex_v2:main"
nunchi-hermes-v2-config = "nunchi_hermes_v2.cli:main"

[project.entry-points."hermes_agent.plugins"]
nunchi-v2 = "nunchi_hermes_v2"

[tool.setuptools.packages.find]
where = ["src", "integrations/hermes/nunchi-gate"]
