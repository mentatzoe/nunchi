[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nunchi"
version = "2.0.0"
description = "Helps AI agents read the room in group conversations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [
  { name = "Nunchi contributors" }
]
dependencies = []
keywords = [
  "nunchi",
  "agents",
  "llm",
  "pre-attention",
  "read-the-room",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
discord = ["discord.py>=2.4"]
mcp-discord = ["mcp>=1.10,<2"]
# The test suite validates schemas and reads workflow YAML.
test = ["jsonschema==4.26.0", "PyYAML==6.0.3"]

[project.urls]
Homepage = "https://github.com/mentatzoe/nunchi"
Repository = "https://github.com/mentatzoe/nunchi"
Issues = "https://github.com/mentatzoe/nunchi/issues"

[project.scripts]
nunchi = "nunchi.cli:main"
nunchi-conformance = "nunchi.conformance:main"
nunchi-turn-conformance = "nunchi.turn_conformance:main"
nunchi-install = "nunchi.install:main"
nunchi-channel = "nunchi.adapters.channel:main"
nunchi-matrix = "nunchi.adapters.matrix:main"
nunchi-telegram = "nunchi.adapters.telegram:main"
nunchi-discord = "nunchi.adapters.discord:main"
nunchi-mcp-discord = "nunchi.mcp_discord.server:main"
nunchi-service-worker = "nunchi.service_worker:main"

[tool.setuptools.packages.find]
where = ["src"]
